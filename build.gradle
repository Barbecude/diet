plugins {
    id 'net.neoforged.moddev' version '1.0.11'
    id 'maven-publish'
    id 'java'
}

version = project.version
group = project.group

base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()

    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
}

neoForge {
    version = '21.0.167'

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
        }
    }

    mods {
        diet {
            sourceSet sourceSets.main
        }
    }

    parchment {
        minecraftVersion = '1.21'
        mappingsVersion = '2024.07.28'
    }
}

dependencies {
    implementation "com.illusivesoulworks.spectrelib:spectrelib-neoforge:${spectrelib_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_author: project.mod_author,
            mod_description: project.mod_description,
            license: project.license,
            issue_tracker: project.issue_tracker
        )
    }

    filesMatching('pack.mcmeta') {
        expand 'mod_name': project.mod_name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    from("COPYING")
    from("COPYING.LESSER")
}

