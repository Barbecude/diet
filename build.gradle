plugins {
    id 'net.neoforged.moddev' version '1.0.11'
    id 'maven-publish'
    id 'java'
}

version = project.version
group = project.group

base {
    archivesName = project.mod_id + '-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
}

neoForge {
    version = '21.0.167'

    parchment {
        minecraftVersion = project.parchment_mc_version
        mappingsVersion = project.parchment_version
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        diet { sourceSet sourceSets.main }
    }
}

sourceSets {
    main {
        java {
            exclude '**/DietFabricMod.java'
            exclude '**/DietFabricClientMod.java'
            exclude '**/DietFabricNetwork.java'
            exclude '**/DietFabricGroups.java'
            exclude '**/DietFabricSuites.java'
            exclude '**/Fabric*.java'
            exclude '**/DietConfigInitializer.java'
            exclude '**/ModIdArgument.java'
            exclude '**/common/component/DietComponent.java'
            exclude '**/common/component/DietComponents.java'
            exclude '**/mixin/DietMixinDietApi.java'
            exclude '**/mixin/MixinLivingEntity.java'
            exclude '**/mixin/MixinPlayer.java'
        }
    }
    main.resources.srcDir 'src/generated/resources'
}

dependencies {
    implementation "com.illusivesoulworks.spectrelib:spectrelib-neoforge:${'${spectrelib_version}'}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_author: project.mod_author,
            mod_description: project.mod_description,
            license: project.license,
            issue_tracker: project.issue_tracker
        )
    }
    filesMatching('pack.mcmeta') {
        expand 'mod_name': project.mod_name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("LICENSE")
    from("COPYING")
    from("COPYING.LESSER")
}
